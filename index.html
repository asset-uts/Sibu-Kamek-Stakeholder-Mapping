<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sibu Kamek — Sign in</title><link rel="stylesheet" href="index.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="shared.js"></script></head>
<body><main class="auth-page"><section class="auth-card"><h1>Sibu Kamek</h1><p class="hint">Stakeholder mapping workshop</p><form id="loginForm"><label for="loginEmail">Email</label><input type="email" id="loginEmail" autocomplete="username" required><label for="loginPassword">Password</label><input type="password" id="loginPassword" autocomplete="current-password" required><p class="error" id="loginError" role="alert"></p><button type="submit">Sign in as admin</button></form><div class="divider">or</div><button id="guestButton" class="secondary" type="button">Login as Guest</button><p class="small">Guests can create a temporary session or join a shared session link without an admin login.</p></section></main><script src="index.js"></script></body></html>
